name: push
on:
  push:
    branches:
      - main
      - master
    tags:
      - v*

permissions:
  contents: read

jobs:
  build-operator:
    runs-on: ubuntu-latest
    name: build-operator
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, s390x]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate code
        run: make generate

      - name: Format and vet
        run: |
          make fmt
          make vet

      - name: Build code
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -o bin/manager main.go

  test-operator:
    runs-on: ubuntu-latest
    name: test-operator
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  github-release:
    runs-on: ubuntu-latest
    name: github-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: ["test-operator", "build-operator"]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
