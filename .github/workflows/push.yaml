name: push
on:
  push:
    branches:
      - main
      - master
    tags:
      - v*

permissions:
  contents: read

jobs:
  build-operator:
    runs-on: ubuntu-latest
    name: build-operator
    strategy:
      matrix:
        arch: [amd64, arm64, ppc64le, s390x]
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Generate code
        run: make generate

      - name: Format and vet
        run: |
          make fmt
          make vet

      - name: Build code
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -o bin/manager main.go

  test-operator:
    runs-on: ubuntu-latest
    name: test-operator
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  github-release:
    runs-on: ubuntu-latest
    name: github-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: ["test-operator", "build-operator"]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
